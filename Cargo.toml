[workspace]
resolver = "3"
members = ["crates/agent", "crates/tui", "crates/aichat", "crates/cli", "crates/config", "crates/core", "crates/mcp", "crates/net", "crates/sandbox", "crates/signing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches the pinned cross-build container, so `cargo build` fails on a feature the
# release build could not compile rather than deferring that to CI.
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/brave-experiments/brave-user-agent"

[workspace.dependencies]
base64 = "0.22"
hmac = "0.12"
landlock = "0.4"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Rust's built-in strip can corrupt some targets under cargo-zigbuild, so
# release builds leave symbols in place and strip during packaging instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
