[workspace]
resolver = "3"
members = ["crates/config", "crates/core", "crates/signing"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/brave-experiments/brave-user-agent"

[workspace.dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

# Rust's built-in strip can corrupt some targets under cargo-zigbuild, so
# release builds leave symbols in place and strip during packaging instead.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
