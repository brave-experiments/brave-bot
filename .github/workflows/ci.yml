name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No credentials here, and none needed: these jobs compile and test rather than
  # producing a binary anyone installs. Signed, configured release binaries are built
  # and published by Jenkins, not this workflow.
  BRAVEBOT_ALLOW_UNCONFIGURED_BUILD: "1"

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --locked

  # Builds against the declared minimum toolchain. The pinned cross-build container
  # ships an older Rust than most developers have locally, so without this a feature
  # that only compiles on a newer toolchain reaches the release build unnoticed.
  minimum-toolchain:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from the workspace
        id: msrv
        run: |
          version="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::rust-version is not declared in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all --locked

  cross-build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            target: aarch64-apple-darwin
            ext: ""
          - name: darwin-amd64
            target: x86_64-apple-darwin
            ext: ""
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - name: windows-amd64
            target: x86_64-pc-windows-gnu
            ext: ".exe"
          - name: windows-arm64
            target: aarch64-pc-windows-gnullvm
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile the Makefile uses, so a local build and a CI build produce
      # the same artifact rather than diverging through a separate host toolchain.
      #
      # Configuration is not baked in here. The workflow-level
      # BRAVEBOT_ALLOW_UNCONFIGURED_BUILD covers forks, PRs, and tag checks alike;
      # Jenkins bakes in credentials for binaries people install.
      - name: Build ${{ matrix.target }}
        run: |
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          for name in SERVICES_KEY_AICHAT BRAVE_SERVICES_KEY_ID BRAVE_AI_CHAT_ENDPOINT \
                      BRAVEBOT_ALLOW_UNCONFIGURED_BUILD; do
            eval "value=\$$name"
            if [ -n "$value" ]; then printf 'export %s=%s\n' "$name" "$value" >> "$env_file"; fi
          done
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.cross \
            -t bravebot-${{ matrix.name }} \
            --build-arg TARGET=${{ matrix.target }} \
            --secret id=bravebot_env,src="$env_file" .

      - name: Extract binary
        run: |
          mkdir -p dist
          docker create --name extract bravebot-${{ matrix.name }} /dev/null
          docker cp extract:/bravebot "dist/bravebot-${{ matrix.name }}${{ matrix.ext }}"
          docker rm extract

      - name: Verify the artifact is the expected format
        run: file "dist/bravebot-${{ matrix.name }}${{ matrix.ext }}"
