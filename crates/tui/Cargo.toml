[package]
name = "bravebot-tui"
description = "Interactive terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Already in the tree for the credential protocol; here it encodes the clipboard escape
# sequence, which is base64 by specification.
base64 = { workspace = true }
bravebot-agent = { path = "../agent" }
bravebot-config = { path = "../config" }
bravebot-core = { path = "../core" }
bravebot-net = { path = "../net" }
bravebot-sandbox = { path = "../sandbox" }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# The tests read the conversation back out of a record, which needs its message type.
bravebot-aichat = { path = "../aichat" }
