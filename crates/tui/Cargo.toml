[package]
name = "bravebot-tui"
description = "Interactive terminal interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Already in the tree for the credential protocol; here it encodes the clipboard escape
# sequence, which is base64 by specification.
base64 = { workspace = true }
bravebot-agent = { path = "../agent" }
# The model picker lists what the endpoint offers, and asking it is this crate's own call
# rather than something a turn does.
bravebot-aichat = { path = "../aichat" }
bravebot-config = { path = "../config" }
bravebot-core = { path = "../core" }
bravebot-net = { path = "../net" }
bravebot-sandbox = { path = "../sandbox" }
# Already in the tree for the credential protocol; here it names a session, which has to be
# opaque and collide with nothing, and OsRng is the source that gives both.
rand = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
# poll(2) on the tty, so an OSC 11 reply can be waited for without hanging when the
# terminal never sends one. Crossterm drops those replies, and a blocking read would
# stall startup on a terminal that does not answer. rustix rather than libc so the
# same syscalls do not need unsafe at this crate.
rustix = { version = "1", features = ["event"] }
